name: Build APK (auto-apply zip)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Yuklangan zip bo'lsa, loyihaga yoyish
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -gt 0 ]; then
            for z in "${zips[@]}"; do
              echo "Yoyilmoqda: $z"
              tmpdir=$(mktemp -d)
              unzip -q "$z" -d "$tmpdir"
              inner=$(find "$tmpdir" -mindepth 1 -maxdepth 1 -type d | head -n1)
              count=$(find "$tmpdir" -mindepth 1 -maxdepth 1 | wc -l)
              if [ "$count" -eq 1 ] && [ -n "$inner" ]; then
                src="$inner"
              else
                src="$tmpdir"
              fi
              rsync -a "$src"/ ./ --exclude '.git' --exclude '.github'
              rm -f "$z"
              rm -rf "$tmpdir"
            done
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Auto: yuklangan zip loyihaga qo'llandi" || echo "O'zgarish yo'q"
            git push
          else
            echo "Yangi zip topilmadi"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10

      - name: Unit testlar + APK yig'ish
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: APK ni Telegram botga yuborish
        if: always()
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
          if [ -f "$APK" ]; then
            curl -s -F document=@"$APK" \
                 -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
                 -F caption="✅ Yangi build tayyor" \
                 "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument"
          else
            curl -s -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
                 -F text="❌ Build muvaffaqiyatsiz tugadi, GitHub Actions'ni tekshiring" \
                 "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage"
          fi

      - name: APK ni yuklab olish uchun saqlash
        uses: actions/upload-artifact@v4
        with:
          name: IshVaqtim-debug-apk
          path: app/build/outputs/apk/debug/*.apk
